.modal h2{margin-top:0}
.pop{animation:riseIn .6s ease both}
.leader,.mem{background:rgba(255,255,255,.07);border:1px solid rgba(111,211,255,.28);border-radius:18px;padding:16px 12px}
.leader{max-width:270px;margin:0 auto 14px;padding:20px 14px}
.crew{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.leader b,.mem b{display:block;color:#fff;font-family:Fredoka,system-ui,sans-serif;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.leader b{font-size:1.25rem}
.leader span,.mem span{display:block;color:#6fd3ff;font-size:.88rem;margin-top:2px}
.badge{display:inline-block;background:linear-gradient(90deg,#2ec5ff,#2f6bff);color:#fff;font:600 .72rem Fredoka,system-ui,sans-serif;letter-spacing:.12em;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#1c3f8f,#0d1b3d);border:3px solid #2ec5ff;display:flex;align-items:center;justify-content:center;font:700 1.8rem Fredoka,system-ui,sans-serif;color:#6fd3ff;margin:0 auto 10px}
.leader .ph{width:112px;height:112px;border-color:#fff;box-shadow:0 0 0 4px #2f6bff,0 0 24px rgba(46,197,255,.55);font-size:2.4rem}
.mrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.mrow input{margin-top:8px}
.mrow .prow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.mrow .ph{margin:0;width:56px;height:56px;font-size:1.2rem;border-width:2px}
.mrow .btn{padding:6px 12px;font-size:.8rem;box-shadow:none}
#editor input[type=file]{width:auto;max-width:100%;padding:6px;margin-top:0}
.cropbox{background:var(--card);color:var(--fg);border-radius:20px;padding:18px;max-width:360px;width:100%;text-align:center;font-family:system-ui,sans-serif}
.cropbox p{margin:0 0 12px;font-size:.9rem;color:var(--mut)}
.cropwrap{position:relative;width:300px;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;background:#222}
.cropwrap::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(circle closest-side,transparent 99%,rgba(0,0,0,.55) 100%)}
.cropcv{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.cropbox input[type=range]{width:100%;margin:14px 0 4px;padding:0;accent-color:var(--acc)}
.cropbtns{display:flex;gap:10px;justify-content:center;margin-top:12px}

</style>
</head>

tujuan.\n\nKeunikan Paws & Traps terletak pada sistem kartu yang berisi berbagai elemen, ramuan, dan bahan kimia. Kartu tersebut dapat memberikan keuntungan bagi pemain atau digunakan untuk membuat jebakan yang dapat dipasang maupun dilemparkan kepada lawan. Pemain harus memanfaatkan kartu dengan tepat untuk membantu timnya memenangkan permainan.\n\nDengan menggabungkan strategi, keberuntungan, dan interaksi antarpemain, Paws & Traps menghadirkan pengalaman bermain yang kompetitif sekaligus memperkenalkan konsep unsur kimia melalui media permainan yang menyenangkan.\n\n2. Tujuan Permainan\nPaws & Traps memiliki tujuan yang berbeda untuk setiap tim.\n\nTim Tikus\n\n* Mendapatkan keju yang berada di kotak nomor 100.\n\n* Menghindari dan melarikan diri dari kejaran tim kucing.\n\n* Membantu rekan satu tim apabila tertangkap.\n\n* Memanfaatkan kartu untuk mempercepat perjalanan dan menghindari jebakan.\n\nTim Kucing\n\n* Mengejar dan menangkap seluruh tikus.\n\n* Memanfaatkan kartu jebakan untuk menghambat pergerakan tikus.\n\n* Menyusun strategi agar tikus tidak berhasil mencapai kotak nomor 100.\n\n3. Menggunakan Kartu\n\nSetelah melempar dadu, pemain dapat memperoleh kartu yang berisi elemen kimia, jebakan, atau keuntungan. Kartu dapat digunakan untuk membantu diri sendiri maupun menghambat pergerakan lawan sesuai efeknya.\n\n4. Menangkap dan Melarikan Diri\n\nTim tikus harus menghindari kejaran kucing dan berusaha mencapai kotak nomor 100. Sementara itu, tim kucing harus menangkap tikus sebelum mereka mendapatkan keju.\n\n5. Menentukan Pemenang\n\nTim tikus menang apabila berhasil memenuhi tujuan mendapatkan keju di kotak nomor 100. Tim kucing menang apabila berhasil menangkap tikus sesuai ketentuan permainan.\n\n6. Komponen Permainan\n\nBerikut komponen utama yang digunakan dalam Paws & Traps:\n\n* Papan Permainan: Terdiri dari 100 kotak yang menjadi jalur perjalanan dan pengejaran antara tikus dan kucing.\n\n* Pion atau Bidak: Digunakan untuk mewakili karakter tikus sebagai pihak yang dikejar dan kucing sebagai pihak pengejar.\n\n* Dadu: Digunakan untuk menentukan jumlah langkah pemain dengan angka 1 sampai 6.\n\n* Kartu Kimia: Kartu yang berisi elemen atau bahan kimia yang dapat digunakan dalam mekanisme permainan.\n\n* Kartu Jebakan: Kartu yang berisi berbagai jenis jebakan untuk menghambat pergerakan lawan.\n\n* Kartu Keuntungan: Kartu yang memberikan kemampuan atau keuntungan tertentu untuk membantu pemain selama permainan.\n\n7. Jenis Kartu Permainan\n\nDalam Paws & Traps terdapat tiga jenis kartu utama yang memiliki fungsi berbeda.\n\na. Kartu Kimia\nKartu elemen berisi berbagai informasi mengenai unsur atau bahan kimia. Kartu ini menjadi bagian dari mekanisme permainan yang dapat digunakan untuk mendukung strategi pemain dalam menghadapi lawan.\n\nb. Kartu Jebakan\nKartu jebakan digunakan untuk menghambat pergerakan lawan. Beberapa contoh jebakan yang terdapat dalam konsep permainan adalah:\n* Pembeku: Menghambat pergerakan pemain.\n\n* Pelicin: Memberikan efek tertentu yang dapat mengganggu perjalanan lawan.\n\n* Jebakan lainnya: Memberikan berbagai efek negatif sesuai isi kartu.\n\nc. Kartu Keuntungan\nKartu keuntungan memberikan peluang bagi pemain untuk memperoleh keunggulan selama permainan. Beberapa contohnya adalah:\n* Langkah Besar: Membantu pemain bergerak lebih jauh.\n\n* Pelindung: Memberikan perlindungan dari efek jebakan.\n\n* Kartu keuntungan lainnya: Memberikan kemampuan khusus untuk membantu pemain mencapai tujuan.\n\n8. Mekanisme Utama\n\nMekanisme utama Paws & Traps menggunakan sistem pergerakan berbasis dadu yang terinspirasi dari permainan ular tangga. Perbedaan utamanya terletak pada sistem pengejaran antara dua tim serta penggunaan kartu sebagai alat untuk membantu atau menghambat lawan.\n\nTim tikus mendapatkan giliran pertama untuk bergerak dan berusaha menjauh dari pengejaran. Setelah itu, tim kucing bergerak untuk mendekati dan menangkap tikus. Selama permainan berlangsung, kedua tim dapat memperoleh berbagai kartu yang memiliki fungsi berbeda.\n\nKartu jebakan dapat memberikan efek yang menghambat pergerakan pemain yang terkena, sedangkan kartu keuntungan dapat membantu pemain memperoleh keunggulan. Pemain harus menentukan waktu penggunaan kartu dengan tepat agar dapat meningkatkan peluang kemenangan timnya.","players":"2–4 pemain","time":"10–15 menit","age":"13+ tahun","steps":["1. Pembagian Tim","Pemain dibagi menjadi dua tim, yaitu tim tikus dan tim kucing. Jika dimainkan oleh empat orang, masing-masing tim terdiri dari dua pemain.","2. Memulai Permainan","Permainan dimulai dari posisi awal. Tim tikus mendapatkan giliran pertama, kemudian dilanjutkan oleh tim kucing. Pemain melempar dadu untuk menentukan jumlah langkah pada papan permainan.","3. Menggunakan Kartu","Setelah melempar dadu, pemain dapat memperoleh kartu yang berisi elemen kimia, jebakan, atau keuntungan. Kartu dapat digunakan untuk membantu diri sendiri maupun menghambat pergerakan lawan sesuai efeknya.","4. Menangkap dan Melarikan Diri","Tim tikus harus menghindari kejaran kucing dan berusaha mencapai kotak nomor 100. Sementara itu, tim kucing harus menangkap tikus sebelum mereka mendapatkan keju."],"features":[{"t":"Mudah Dipelajari","d":"Aturan simpel, seperti bermain ular tangga."},{"t":"Seru Bareng","d":"Cocok dimainkan dengan teman, keluarga, dan sahabat."},{"t":"Adu keberuntungan","d":"Strategi dan kejutan yang selalu berubah di setiap permainan."}],"contactText":"Tertarik, atau mau tanya-tanya? Hubungi kami.","contactLabel":"Hubungi Kami","contactLink":"https://example.com","contacts":[{"n":"Sultan Arradin","u":"@sultanarradeeen"},{"n":"Pasha Muzakkir","u":"@pshamzkkir_"},{"n":"Jaguar Ar Rhazez","u":"@jaguararrhazez"}]}</script>

  var L=String(text||'').split('\n').map(function(x){return x.trim()});
  function flush(){if(pr.length){cur.append(h('p',null,pr.join(' ')));pr=[]}}
  function nextLine(i){for(var j=i+1;j<L.length;j++)if(L[j])return L[j];return ''}
  for(var i=0;i<L.length;i++){
    var l=L[i];
    if(!l){flush();continue}
    if(/^[-\u2022*]\s+/.test(l)){
      flush();if(!ul){ul=h('ul','bul');cur.append(ul)}
      var t=l.replace(/^[-\u2022*]\s+/,''),li=h('li'),k=t.indexOf(':');
      if(k>0&&k<=40){li.append(h('b','bl',t.slice(0,k+1)),document.createTextNode(t.slice(k+1)))}else li.textContent=t;
      ul.append(li);continue;
    }
    ul=null;
    var nm=l.match(/^(\d+)\.\s+(.+)$/);
    if(nm){
      flush();var dt=h('details','sec'),sm=h('summary'),bd=h('div','sbody');
      sm.append(h('span','num',nm[1]),h('span','ttl',nm[2]));dt.append(sm,bd);
      if(!opened){dt.open=true;opened=true}
      el.append(dt);cur=bd;continue;
    }
    var nx=nextLine(i);
    if(/^[a-z]\.\s+\S/i.test(l)||(l.length<=32&&!/[.:;!?,]$/.test(l)&&nx&&!/^\d+\.\s/.test(nx))){flush();cur.append(h('h4','sub2',l));continue}
    pr.push(l);
  }
  flush();
}

function makeDice(){
  var P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

  var box=h('div','dicebox'),sc=h('div','scene'),tilt=h('div','tilt'),cube=h('div','cube'),res=h('p','dres');
  sc.setAttribute('role','button');sc.tabIndex=0;sc.setAttribute('aria-label','Lempar dadu');sc.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sc.onclick()}};

  tilt.append(cube);sc.append(tilt);res.setAttribute('aria-live','polite');res.textContent='Tap dadunya buat melempar! \ud83c\udfb2';

  sc.onclick=function(){
    if(busy)return;busy=true;count++;box.classList.remove('jackpot');
    var n=1+Math.floor(Math.random()*6);spins+=3;
    cube.style.transform='rotateX('+(A[n][0]+360*spins)+'deg) rotateY('+(A[n][1]+360*spins)+'deg)';
    sc.classList.remove('rolling');void sc.offsetWidth;sc.classList.add('rolling');

}

function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('gagal memproses gambar'))},'image/jpeg',0.85)};im.onerror=function(){rej(new Error('file bukan gambar'))};im.src=u})}
function cropPhoto(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('file bukan gambar'))};
  im.onload=function(){
    var S=300,base=Math.max(S/im.width,S/im.height),z=1,ox=(S-im.width*base)/2,oy=(S-im.height*base)/2;
    var ov=h('div','overlay'),bx=h('div','cropbox'),wrap=h('div','cropwrap'),cv=document.createElement('canvas');
    ov.style.zIndex=30;cv.width=cv.height=S;cv.className='cropcv';wrap.append(cv);
    var zr=h('input');zr.type='range';zr.min=1;zr.max=3;zr.step=0.01;zr.value=1;
    function clamp(){ox=Math.min(0,Math.max(S-im.width*base*z,ox));oy=Math.min(0,Math.max(S-im.height*base*z,oy))}
    function draw(c,k){var cx=c.getContext('2d');cx.clearRect(0,0,c.width,c.height);cx.drawImage(im,ox*k,oy*k,im.width*base*z*k,im.height*base*z*k)}
    function paint(){clamp();draw(cv,1)}
    zr.oninput=function(){var nz=parseFloat(zr.value),ci=(S/2-ox)/(base*z),cj=(S/2-oy)/(base*z);z=nz;ox=S/2-ci*base*z;oy=S/2-cj*base*z;paint()};
    var drag=null;
    cv.onpointerdown=function(e){drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
    cv.onpointermove=function(e){if(!drag)return;var k=S/cv.clientWidth;ox+=(e.clientX-drag.x)*k;oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};paint()};
    cv.onpointerup=cv.onpointercancel=function(){drag=null;cv.style.cursor='grab'};
    cv.addEventListener('wheel',function(e){e.preventDefault();zr.value=Math.min(3,Math.max(1,parseFloat(zr.value)-e.deltaY*0.002));zr.oninput()},{passive:false});
    function done(){ov.remove();URL.revokeObjectURL(u)}
    var ok=h('button','btn','Pakai foto ini'),no=h('button','btn alt','Batal'),bt=h('div','cropbtns');ok.type=no.type='button';bt.append(no,ok);
    ok.onclick=function(){var oc=document.createElement('canvas');oc.width=oc.height=480;draw(oc,480/S);oc.toBlob(function(b){done();b?res(b):rej(new Error('gagal memproses gambar'))},'image/jpeg',0.88)};
    no.onclick=function(){done();rej(new Error('dibatalkan'))};
    bx.append(h('p',null,'Geser foto untuk mengatur posisi, geser slider untuk zoom. Bagian yang terang adalah yang akan tampil.'),wrap,zr,bt);
    ov.append(bx);document.body.append(ov);paint();
  };
  im.src=u;
})}
function openEditor(){

      f.onchange=async function(){var file=f.files[0];if(!file)return;try{var b=await cropPhoto(file);x.p=await new Promise(function(r,j){var fr=new FileReader();fr.onload=function(){r(fr.result)};fr.onerror=function(){j(new Error('gagal membaca foto'))};fr.readAsDataURL(b)});drawM()}catch(e){if(e&&e.message==='dibatalkan'){f.value='';return}alert('Gagal upload foto: '+((e&&e.message)||'coba lagi'))}};
      pr.append(f);
      if(x.p){var d=h('button','btn alt','Hapus foto');d.type='button';d.onclick=function(){x.p='';drawM()};pr.append(d)}
      if(i>0){var rm=h('button','btn alt','Hapus anggota');rm.type='button';rm.onclick=function(){draft.splice(i,1);drawM()};pr.append(rm)}

  }
